<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">ArchiTECH — Architecture, Automation, Intelligence</title>
  <desc id="description">A dark navy banner with silver and cyan ArchiTECH lettering, a blueprint-style architectural model, and the labels Revit API, BIM automation, and local AI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c17" />
      <stop offset="1" stop-color="#10243c" />
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#aabbd1" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f9bff" />
      <stop offset="1" stop-color="#53e8ed" />
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#167aca" stop-opacity="0.22" />
      <stop offset="1" stop-color="#167aca" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#73bde5" stroke-opacity="0.09" stroke-width="0.7" />
    </pattern>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="338" rx="22" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#background)" />
    <rect x="682" width="518" height="340" fill="url(#grid)" />
    <ellipse cx="958" cy="194" rx="296" ry="228" fill="url(#halo)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
    </ellipse>
    <rect x="-330" y="0" width="160" height="340" fill="#3ecdf4" opacity="0.06" transform="skewX(-20)">
      <animate attributeName="x" values="-330;1550" dur="7s" repeatCount="indefinite" />
    </rect>
    <path d="M0 337H1200" stroke="url(#accent)" stroke-width="5" />
    <path d="M700 0V340" stroke="#68b6e0" stroke-opacity="0.11" />

    <g font-family="DejaVu Sans, Arial, sans-serif">
      <text x="58" y="50" fill="#8aa9c8" font-size="12" font-weight="600" letter-spacing="3">DESIGN THINKING. ENGINEERING PRECISION.</text>
      <text x="55" y="126" font-size="70" font-weight="700" letter-spacing="-3"><tspan fill="url(#silver)">Archi</tspan><tspan fill="url(#accent)">TECH</tspan></text>
      <text x="58" y="177" fill="#eef4fc" font-size="27" font-weight="500" letter-spacing="-0.5">Architecture. Automation. Intelligence.</text>
      <text x="58" y="212" fill="#a8bed4" font-size="17">BIM systems built for the way AEC teams work.</text>

      <g font-size="11" font-weight="600" letter-spacing="1.5">
        <rect x="58" y="259" width="112" height="30" rx="6" fill="#0c2034" stroke="#28465f" />
        <text x="114" y="279" text-anchor="middle" fill="#c5e6ff">REVIT API</text>
        <rect x="182" y="259" width="169" height="30" rx="6" fill="#0c2034" stroke="#28465f" />
        <text x="266.5" y="279" text-anchor="middle" fill="#c5e6ff">BIM AUTOMATION</text>
        <rect x="363" y="259" width="110" height="30" rx="6" fill="#0c2034" stroke="#28465f" />
        <text x="418" y="279" text-anchor="middle" fill="#5fe2ed">LOCAL AI</text>
      </g>
    </g>

